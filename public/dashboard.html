<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>eXight 4パネル表示</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100vw;
    height: 100vh;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
    width: 100vw;
    height: 100vh;
  }
  .panel {
    border: none;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  .panel iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <div class="dashboard-grid">
    <div class="panel"><iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=dashboard"></iframe></div>
    <div class="panel"><iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=control"></iframe></div>
    <div class="panel"><iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=anomaly"></iframe></div>
    <div class="panel"><iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=quiz"></iframe></div>
  </div>
</body>
</html>
