<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>稼働状況 プレビュー</title>
<style>
  :root{
    --bg: #0a0f1a;
    --bg-panel: #121b2e;
    --bg-inset: rgba(255,255,255,0.04);
    --border-soft: #1f2b42;
    --text-primary: #e8edf5;
    --text-secondary: #8a97ac;
    --speed: #29d4ff;
    --torque: #ffb238;
    --cycle: #33d17a;
    --accent: #4d7cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text-primary);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,-apple-system,sans-serif;}
  body{padding:28px;}
  .page-title{font-size:13px;letter-spacing:.08em;color:var(--text-secondary);margin:0 0 16px 2px;text-transform:uppercase;}

  .op-status__layout{
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:stretch;
    max-width:1180px;
  }

  /* ---- cycle time: compact box, top-left ---- */
  .op-status__cycle-corner{
    align-self:flex-start;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:10px;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:8px 14px;
  }
  .op-status__title--inline{
    margin-bottom:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--text-secondary);
    white-space:nowrap;
  }
  .cycle-time{display:flex;flex-direction:row;align-items:baseline;gap:4px;}
  .cycle-time__value{font-size:22px;font-weight:800;line-height:1;color:var(--cycle);font-variant-numeric:tabular-nums;}
  .cycle-time__unit{font-size:11px;color:var(--text-secondary);}

  /* ---- robot cards row ---- */
  .op-status__row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    min-width:0;
  }
  .op-status__card{
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:16px;
    min-width:0;
  }
  .op-status__title{
    font-size:13px;
    font-weight:700;
    color:var(--text-primary);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .op-status__title .dot{width:7px;height:7px;border-radius:50%;background:var(--speed);box-shadow:0 0 8px var(--speed);}

  /* body: image w/ joint markers on the left, motor chips on the right, svg overlay for lines */
  .callout-wrap{
    position:relative;
    display:grid;
    grid-template-columns:150px 1fr;
    column-gap:4px;
    align-items:center;
  }
  .robot-img-box{
    position:relative;
    width:150px;
    aspect-ratio: 4 / 3;
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-inset);
  }
  .robot-img-box img{width:100%;height:100%;object-fit:contain;display:block;}

  .joint-dot{
    position:absolute;
    width:16px;height:16px;
    margin-left:-8px;margin-top:-8px;
    border-radius:50%;
    background:rgba(41,212,255,0.16);
    border:1.5px solid var(--speed);
    color:var(--speed);
    font-size:9px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }

  .chip-col{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-left:10px;
  }
  .motor-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-inset);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:5px 8px;
    transition:border-color .15s, background .15s;
  }
  .motor-chip.is-active{
    border-color:var(--speed);
    background:rgba(41,212,255,0.08);
  }
  .motor-chip__label{
    flex:0 0 30px;
    font-size:12px;
    font-weight:800;
    color:var(--text-primary);
  }
  .motor-chip__vals{
    display:flex;
    gap:10px;
    margin-left:auto;
    font-variant-numeric:tabular-nums;
  }
  .motor-chip__val{display:flex;align-items:baseline;gap:2px;font-size:12.5px;font-weight:700;}
  .motor-chip__val--speed{color:var(--speed);}
  .motor-chip__val--torque{color:var(--torque);}
  .motor-chip__unit{font-size:9px;font-weight:500;color:var(--text-secondary);}

  svg.connectors{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
  }
  svg.connectors path{
    fill:none;
    stroke:var(--speed);
    stroke-width:1.1;
    stroke-dasharray:2.5 3;
    opacity:.55;
  }
  svg.connectors path.is-active{opacity:1;stroke-width:1.6;stroke-dasharray:none;}
  svg.connectors circle.anchor{fill:var(--speed);opacity:.9;}

  .legend{
    display:flex;gap:16px;margin-top:18px;font-size:11px;color:var(--text-secondary);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
</style>
</head>

<div class="legend">
  <span><i style="background:var(--speed)"></i>速度 (mm/s)</span>
  <span><i style="background:var(--torque)"></i>トルク (%)</span>
  <span><i style="background:var(--cycle)"></i>サイクルタイム (sec)</span>
</div>

<script>
// 関節（軸）位置：画像に対する割合(%) — 実写真の関節バンド/フランジ位置を目視で概算
// 実際の画像を差し替えた際は、この座標も合わせて微調整してください
const JOINTS = [
  { n: 1, x: 58, y: 82 },   // 軸1：ベース旋回
  { n: 2, x: 68, y: 49 },   // 軸2：肩
  { n: 3, x: 71, y: 35 },   // 軸3：肘
  { n: 4, x: 62, y: 26 },   // 軸4：前腕回転
  { n: 5, x: 44, y: 19 },   // 軸5：手首
  { n: 6, x: 26, y: 21 },   // 軸6：フランジ
];

const DATA = {
  A: [
    {speed:78,torque:53},{speed:75,torque:50},{speed:80,torque:55},
    {speed:72,torque:48},{speed:77,torque:52},{speed:79,torque:54},
  ],
  B: [
    {speed:82,torque:55},{speed:79,torque:51},{speed:84,torque:57},
    {speed:76,torque:49},{speed:81,torque:53},{speed:83,torque:56},
  ],
};

function buildRobot(prefix){
  const wrap = document.getElementById('wrap'+prefix);
  const imgBox = document.getElementById('imgBox'+prefix);
  const chipCol = document.getElementById('chipCol'+prefix);
  const svg = document.getElementById('svg'+prefix);
  const data = DATA[prefix];

  // dots on image
  JOINTS.forEach(j=>{
    const dot = document.createElement('div');
    dot.className='joint-dot';
    dot.style.left = j.x+'%';
    dot.style.top = j.y+'%';
    dot.textContent = j.n;
    dot.dataset.n = j.n;
    imgBox.appendChild(dot);
  });

  // chips
  JOINTS.forEach(j=>{
    const d = data[j.n-1];
    const chip = document.createElement('div');
    chip.className='motor-chip';
    chip.dataset.n = j.n;
    chip.innerHTML = `
      <span class="motor-chip__label">${prefix}-${j.n}</span>
      <span class="motor-chip__vals">
        <span class="motor-chip__val motor-chip__val--speed">${d.speed}<span class="motor-chip__unit">mm/s</span></span>
        <span class="motor-chip__val motor-chip__val--torque">${d.torque}<span class="motor-chip__unit">%</span></span>
      </span>`;
    chipCol.appendChild(chip);

    chip.addEventListener('mouseenter', ()=> setActive(prefix, j.n, true));
    chip.addEventListener('mouseleave', ()=> setActive(prefix, j.n, false));
  });

  drawLines(prefix);
}

function setActive(prefix, n, on){
  const wrap = document.getElementById('wrap'+prefix);
  wrap.querySelector(`.motor-chip[data-n="${n}"]`).classList.toggle('is-active', on);
  wrap.querySelector(`.joint-dot[data-n="${n}"]`).style.background = on ? 'rgba(41,212,255,0.35)' : 'rgba(41,212,255,0.16)';
  const path = wrap.querySelector(`path[data-n="${n}"]`);
  if(path) path.classList.toggle('is-active', on);
}

function drawLines(prefix){
  const wrap = document.getElementById('wrap'+prefix);
  const wrapRect = wrap.getBoundingClientRect();
  const imgBox = document.getElementById('imgBox'+prefix);
  const imgRect = imgBox.getBoundingClientRect();
  const svg = document.getElementById('svg'+prefix);
  svg.innerHTML = '';

  JOINTS.forEach(j=>{
    const startX = imgRect.left - wrapRect.left + (j.x/100)*imgRect.width;
    const startY = imgRect.top - wrapRect.top + (j.y/100)*imgRect.height;

    const chip = wrap.querySelector(`.motor-chip[data-n="${j.n}"]`);
    const chipRect = chip.getBoundingClientRect();
    const endX = chipRect.left - wrapRect.left;
    const endY = chipRect.top - wrapRect.top + chipRect.height/2;

    const midX = startX + (endX-startX)*0.45;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
    path.setAttribute('data-n', j.n);
    svg.appendChild(path);

    const anchor = document.createElementNS('http://www.w3.org/2000/svg','circle');
    anchor.setAttribute('cx', startX);
    anchor.setAttribute('cy', startY);
    anchor.setAttribute('r', 1.6);
    anchor.setAttribute('class','anchor');
    svg.appendChild(anchor);
  });
}

['A','B'].forEach(buildRobot);
window.addEventListener('resize', ()=>{ ['A','B'].forEach(drawLines); });
</script>
