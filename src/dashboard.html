<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>eXight 4パネル表示</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100vw;
    height: 100vh;
  }

  /* 1920×2160 が横に4枚並ぶ構成 */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
    width: 100vw;
    height: 100vh;
  }

  .panel {
    border: none;   /* 白線を出したくない場合は none のまま */
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .panel iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <div class="dashboard-grid">
    <div class="panel" id="panel-1">
      <iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=dashboard"></iframe>
    </div>
    <div class="panel" id="panel-2">
      <iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=control"></iframe>
    </div>
    <div class="panel" id="panel-3">
      <iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=anomaly"></iframe>
    </div>
    <div class="panel" id="panel-4">
      <iframe src="https://joyful-sunshine-9b2402.netlify.app/?page=quiz"></iframe>
    </div>
  </div>
</body>
</html>
